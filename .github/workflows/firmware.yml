name: firmware
on:
  push:
    branches: ["**"]
    # A tag fw-v<version> (e.g. fw-v1.1) also publishes a GitHub Release with the
    # .uf2, which the app's Settings page offers as "latest firmware"
    tags: ["fw-v*"]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only used by the release step
    defaults:
      run:
        working-directory: firmware
    steps:
      # First: every run step starts in firmware/ (defaults above), which only
      # exists after the checkout
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi cmake
      # 2.2.0 brings TinyUSB 0.18.0, which tinyusb_patched/cdc_device.c is based on
      - run: git clone --depth 1 -b 2.2.0 https://github.com/raspberrypi/pico-sdk
      - run: cd pico-sdk && git submodule update --init lib/tinyusb
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pico_serprog
          path: |
            firmware/build/pico_serprog.uf2
            firmware/build/pico_serprog.elf
      - name: Check that the tag matches FW_VERSION
        id: version
        if: startsWith(github.ref, 'refs/tags/fw-v')
        run: |
          version="${GITHUB_REF_NAME#fw-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          grep -q "#define FW_VERSION  \"$version\"" main.c || {
            echo "Tag $GITHUB_REF_NAME doesn't match FW_VERSION in main.c" >&2; exit 1; }
          cp build/pico_serprog.uf2 "build/hydraflasher-fw-$version.uf2"
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/fw-v')
        run: |
          # The "## <version> · <date>" section, without its heading, up to the next "## "
          version="${GITHUB_REF_NAME#fw-v}"
          awk -v v="$version" '
            /^## / { inside = ($2 == v) ; next }
            inside { print }
          ' CHANGELOG.md > build/release-notes.md
          grep -q '[^[:space:]]' build/release-notes.md || {
            echo "No '## $version' section in firmware/CHANGELOG.md: write the notes first" >&2
            exit 1; }
          cat build/release-notes.md
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/fw-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Firmware v${{ steps.version.outputs.version }}
          # The changelog section, followed by GitHub's list of merged pull requests
          body_path: firmware/build/release-notes.md
          generate_release_notes: true
          # "Latest" on the releases page stays with the app download
          make_latest: "false"
          files: firmware/build/hydraflasher-fw-*.uf2
